[tool.uv]
# `uv` is a lightweight environment manager that reads `pyproject.toml`'s
# `project.dependencies`. No extra config is required for a basic setup, but
# you can lock or pin as you prefer with `uv lock`/`uv install`.

[tool.project-conversion-notes]
# Notes for the user converting from conda -> pip/uv
# - Packages such as `cudatoolkit`, `cudnn`, `cupti`, `lib*`, and other low-level
#   system libraries are not installable through pip/pyproject. Install them
#   separately using conda, your system package manager, or follow vendor CUDA
#   installation instructions for GPU support.
# - Some conda packages may have different names or builds on PyPI. If you hit
#   incompatibilities, prefer creating a conda env for GPU/c-extension needs.
# - `tensorflow-gpu` used in conda is represented here by `tensorflow==2.4.1`.
#   GPU support requires compatible CUDA/cuDNN installed separately (not via pip).[project]
name = "basic-sense-cs"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = []

[tool.uv.extra-build-dependencies]
h5py = ["Cython", "numpy", "pkgconfig"]